packages:
  - packages/*
  - apps/*

allowBuilds:
  "@parcel/watcher": true
  esbuild: true

catalog:
  "@changesets/cli": 2.31.1
  "@commitlint/cli": 21.2.1
  "@commitlint/config-conventional": 21.2.0
  "@floating-ui/dom": 1.8.0
  "@storybook/addon-a11y": 10.5.7
  "@storybook/addon-docs": 10.5.7
  "@storybook/addon-themes": 10.5.7
  "@storybook/addon-vitest": 10.5.7
  "@storybook/react": 10.5.7
  "@storybook/react-vite": 10.5.7
  "@testing-library/jest-dom": 7.0.0
  "@testing-library/react": 16.3.2
  "@testing-library/user-event": 14.6.3
  "@types/node": 26.2.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "@vitejs/plugin-react": 6.0.5
  "@vitest/browser-playwright": 4.1.10
  "@biomejs/biome": 2.5.7
  "@vitest/coverage-istanbul": 4.1.10
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  husky: 9.1.7
  jsdom: 30.0.1
  lint-staged: 17.3.0
  # Declared explicitly rather than left as an auto-installed peer of
  # @vitest/browser-playwright: CI installs browsers from it, so the version has
  # to be pinnable and cacheable on the lockfile hash.
  playwright: 1.58.2
  prettier: 3.9.6
  react: 19.2.8
  react-dom: 19.2.8
  react-router: 8.3.0
  remark-gfm: 4.0.1
  sass: 1.102.0
  storybook: 10.5.7
  turbo: 2.10.9
  typescript: 7.0.2
  vite: 8.2.1
  vitest: 4.1.10

ignoredBuiltDependencies:
  - "@parcel/watcher"
  - esbuild

prefer-workspace-packages: true
